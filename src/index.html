<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltaic Valorant Benchmarks S1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'v-main': '#0c0c0c',
                        'v-surface': '#141414',
                        'v-header': '#1a1a1a',
                        'v-radiant': '#c29a4a',
                        'v-elysian': '#5b6ee1',
                        'v-aurora': '#df3e7b',
                        'v-angelic': '#7ed3f2',
                        'v-energy': '#d97706',
                        'v-border': '#ffffff0d',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        :root {
            --day-width: 60px;
            --scenario-width: 260px;
            --v-aurora: #df3e7b;
        }

        .cell {
            border-right: 1px solid #ffffff0d;
            border-bottom: 1px solid #ffffff0d;
            padding: 1rem 0.75rem;
            text-align: center;
            white-space: nowrap;
            height: 80px;
            position: relative;
            transition: background-color 0.2s;
        }

        .w-scenario {
            width: var(--scenario-width);
            min-width: var(--scenario-width);
            max-width: var(--scenario-width);
            background-color: #141414;
            font-weight: 700;
            position: sticky;
            left: 0;
            z-index: 5;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            text-align: left;
            padding-left: 1rem;
        }

        .w-day {
            width: var(--day-width);
            min-width: var(--day-width);
            max-width: var(--day-width);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .w-stat {
            width: 45px;
            color: white;
            font-weight: 900;
            font-size: 12px;
            background-color: rgba(223, 62, 123, 0.2);
            transition: all 0.3s;
        }

        .w-stat.collapsed {
            width: 1px !important;
            min-width: 1px !important;
            padding: 0 !important;
            border-right: 1px solid #6366f1;
            cursor: pointer;
            overflow: visible;
            font-size: 0;
            background: none !important;
            clip-path: none !important;
            position: relative;
        }
        /* Hit area for clicking the 1px line */
        .w-stat.collapsed::after {
            content: '';
            position: absolute;
            top: 0;
            left: -10px;
            width: 20px;
            height: 100%;
            z-index: 20;
        }
        .w-stat.collapsed:hover {
            border-right: 2px solid #ffffff;
        }

        .w-stat.collapsed * { display: none; }

        .resize-handle {
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            cursor: col-resize;
            transition: background-color 0.2s;
            z-index: 10;
        }
        .resize-handle:hover { background-color: rgba(194, 154, 74, 0.5); }

        ::-webkit-scrollbar { height: 10px; width: 10px; }
        ::-webkit-scrollbar-track { background: #05070a; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border: 2px solid #05070a; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>

<body class="bg-v-main text-slate-100 font-sans text-[12px] antialiased select-none">
    <div class="p-5 inline-block min-w-full">
        <div class="rounded-xl border border-v-border overflow-hidden">
            <table class="table-fixed border-separate border-spacing-0">
                <thead class="sticky top-0 z-10">
                    <tr id="header-row-1">
                        <th
                            class="cell w-scenario bg-v-surface/95 backdrop-blur-md border-b-2 border-b-[#6366f1] h-14 uppercase tracking-widest !text-left pl-4 rounded-tl-xl">
                        <div class="flex items-center justify-between text-sm w-[150px]">
                            <button onclick="changeMonth(-1)"
                                class="hover:text-v-radiant transition-colors text-lg">&lt;</button>
                            <span id="month-display" class="text-center text-v-radiant flex-1">Marzo</span>
                            <button onclick="changeMonth(1)"
                                class="hover:text-v-radiant transition-colors text-lg">&gt;</button>
                        </div>
                        <div class="resize-handle" onmousedown="startResize(event, 'scenario')"></div>
                    </th>
                    <!-- JS will populate the rest -->
                </tr>
            </thead>
            <tbody id="tasks-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const months = ["ene.", "feb.", "mar.", "abr.", "may.", "jun.", "jul.", "ago.", "sept.", "oct.", "nov.", "dic."];
        let currentDate = new Date();
        let ranksCollapsed = false;

        const tasks = [
            { name: "VT FLOATSHOT VALORANT HARD", color: "v-radiant", initial: 1250 },
            { name: "VT ANGLESHOT VALORANT HARD", color: "v-elysian", initial: 1300 },
            { name: "VT DOTTS VALORANT HARD", color: "v-aurora", initial: 3200 },
            { name: "VT FOURSHOT ADAPTIVE VALORANT", color: "v-angelic", initial: 1575 }
        ];

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            render();
        }

        function toggleRanks() {
            ranksCollapsed = !ranksCollapsed;
            render(); // Re-render to apply classes
        }

        // Custom Resize Logic
        let isResizing = false;
        let resizeType = '';
        let startX, startWidth;

        function startResize(e, type) {
            isResizing = true;
            resizeType = type;
            startX = e.pageX;
            startWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue(type === 'day' ? '--day-width' : '--scenario-width'));

            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', stopResize);
            document.body.classList.add('cursor-col-resize');
        }

        function handleMouseMove(e) {
            if (!isResizing) return;
            const delta = e.pageX - startX;
            const newWidth = Math.max(10, startWidth + delta);
            document.documentElement.style.setProperty(resizeType === 'day' ? '--day-width' : '--scenario-width', `${newWidth}px`);
        }

        function stopResize() {
            isResizing = false;
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', stopResize);
            document.body.classList.remove('cursor-col-resize');
        }

        function render() {
            const headerRow = document.getElementById('header-row-1');
            const tbody = document.getElementById('tasks-body');
            const monthDisplay = document.getElementById('month-display');

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            monthDisplay.innerText = `${months[month]} ${year}`;

            while (headerRow.children.length > 1) headerRow.removeChild(headerRow.lastChild);

            let headerHtml = '';
            const totalBlocks = Math.ceil(daysInMonth / 5);
            for (let block = 0; block < totalBlocks; block++) {
                for (let day = 1; day <= 5; day++) {
                    const dayNum = (block * 5) + day;
                    if (dayNum > daysInMonth) break;
                    headerHtml += `<th class="cell w-day bg-v-surface/95 backdrop-blur-md text-[8px] text-slate-400 uppercase">
                        DAY ${dayNum}
                        <div class="resize-handle" onmousedown="startResize(event, 'day')"></div>
                    </th>`;
                }
                headerHtml += `<th onclick="toggleRanks()" class="cell w-stat !bg-v-aurora/20 border-v-border cursor-pointer hover:bg-v-aurora/40 ${ranksCollapsed ? 'collapsed' : ''}">1%</th>`;
            }
            headerRow.insertAdjacentHTML('beforeend', headerHtml);

            let bodyHtml = '';
            tasks.forEach(task => {
                const goalValue = (task.initial * 1.01).toFixed(1);
                bodyHtml += `<tr class="hover:bg-white/5 transition-colors group">
                    <td class="cell w-scenario group-hover:bg-slate-800 transition-colors">
                        <div class="flex flex-col gap-1 overflow-hidden">
                            <div contenteditable="true" class="outline-none focus:text-v-radiant transition-colors truncate">${task.name}</div>
                            <div class="flex gap-3 text-[9px] font-normal text-slate-500 uppercase tracking-tighter">
                                <span class="bg-black/30 px-1 rounded-sm">Init: <span contenteditable="true" class="text-slate-300 outline-none">${task.initial}</span></span>
                                <span class="bg-black/30 px-1 rounded-sm">Goal: <span contenteditable="true" class="text-v-radiant outline-none">${goalValue}</span></span>
                            </div>
                        </div>
                    </td>`;

                for (let block = 0; block < totalBlocks; block++) {
                    for (let day = 1; day <= 5; day++) {
                        const dayNum = (block * 5) + day;
                        if (dayNum > daysInMonth) break;
                        bodyHtml += `<td class="cell w-day !p-0"><div contenteditable="true" class="outline-none w-full h-full text-center leading-[80px]"></div></td>`;
                    }
                    bodyHtml += `<td class="cell w-stat !bg-${task.color}/20 !text-${task.color} ${ranksCollapsed ? 'collapsed' : ''}">
                        <span class="text-[10px] font-bold">▲R</span>
                    </td>`;
                }
                bodyHtml += `</tr>`;
            });
            tbody.innerHTML = bodyHtml;
        }

        render();
    </script>
</body>

</html>
