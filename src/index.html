<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltaic Valorant Benchmarks S1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'v-main': '#0c0c0c',
                        'v-surface': '#141414',
                        'v-header': '#1a1a1a',
                        'v-radiant': '#c29a4a',
                        'v-elysian': '#5b6ee1',
                        'v-aurora': '#df3e7b',
                        'v-angelic': '#7ed3f2',
                        'v-energy': '#d97706',
                        'v-border': '#ffffff0d',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        :root {
            --day-width: 60px;
            --scenario-width: 260px;
            --v-aurora: #df3e7b;
        }

        .cell {
            border-right: 1px solid #ffffff0d;
            border-bottom: 1px solid #ffffff0d;
            padding: 1rem 0.75rem;
            text-align: center;
            white-space: nowrap;
            height: 80px;
            position: relative;
            transition: background-color 0.2s;
        }

        .w-scenario {
            width: var(--scenario-width);
            min-width: var(--scenario-width);
            max-width: var(--scenario-width);
            background-color: #141414;
            font-weight: 700;
            position: sticky;
            left: 0;
            z-index: 5;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            text-align: left;
            padding-left: 1rem;
        }

        .w-day {
            width: var(--day-width);
            min-width: var(--day-width);
            max-width: var(--day-width);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .w-stat {
            width: 45px;
            color: white;
            font-weight: 900;
            font-size: 12px;
            background-color: rgba(223, 62, 123, 0.2);
            transition: all 0.3s;
        }

        .w-stat.collapsed {
            width: 1px !important;
            min-width: 1px !important;
            padding: 0 !important;
            border-right: 1px solid #6366f1;
            cursor: pointer;
            overflow: visible;
            font-size: 0;
            background: none !important;
            clip-path: none !important;
            position: relative;
        }

        /* Hit area for clicking the 1px line */
        .w-stat.collapsed::after {
            content: '';
            position: absolute;
            top: 0;
            left: -10px;
            width: 20px;
            height: 100%;
            z-index: 20;
        }

        .w-stat.collapsed:hover {
            border-right: 2px solid #ffffff;
        }

        .w-stat.collapsed * {
            display: none;
        }

        .resize-handle {
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            cursor: col-resize;
            transition: background-color 0.2s;
            z-index: 10;
        }

        .resize-handle:hover {
            background-color: rgba(194, 154, 74, 0.5);
        }

        ::-webkit-scrollbar {
            height: 10px;
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #05070a;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border: 2px solid #05070a;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        ::selection {
            background-color: rgba(99, 102, 241, 0.4);
            color: white;
        }

        /* Hide number input spinners */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>

<body class="bg-v-main text-slate-100 font-sans text-[12px] antialiased select-none">
    <div class="p-5 inline-block min-w-full">
        <div class="rounded-xl border border-v-border overflow-hidden">
            <table class="table-fixed border-separate border-spacing-0">
                <thead class="sticky top-0 z-10">
                    <tr id="header-row-1">
                        <th
                            class="cell w-scenario bg-v-surface/95 backdrop-blur-md border-b-2 border-b-[#6366f1] h-14 uppercase tracking-widest !text-left pl-4 rounded-tl-xl">
                            <div class="flex items-center justify-between text-sm w-[150px]">
                                <button onclick="changeMonth(-1)"
                                    class="hover:text-v-radiant transition-colors text-lg">&lt;</button>
                                <span id="month-display" class="text-center text-v-radiant flex-1">Marzo</span>
                                <button onclick="changeMonth(1)"
                                    class="hover:text-v-radiant transition-colors text-lg">&gt;</button>
                            </div>
                            <div class="resize-handle" onmousedown="startResize(event, 'scenario')"></div>
                        </th>
                        <!-- JS will populate the rest -->
                    </tr>
                </thead>
                <tbody id="tasks-body"></tbody>
            </table>
        </div>
        <div class="mt-4 flex gap-2">
            <button onclick="addTask()" class="px-4 py-2 bg-v-surface border border-v-border text-slate-300 hover:text-white hover:border-[#6366f1] rounded-md text-xs font-bold uppercase transition-colors">+ Añadir Tarea</button>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-center p-4">
        <div class="bg-v-surface border border-v-border p-6 rounded-xl max-w-sm w-full shadow-2xl scale-95 opacity-0 transition-all duration-300" id="modal-content">
            <h3 class="text-v-radiant font-bold text-lg mb-2 uppercase tracking-wider">Confirmar Acción</h3>
            <p class="text-slate-300 text-sm mb-6" id="modal-message">¿Estás seguro de que deseas eliminar esta tarea?</p>
            <div class="flex justify-end gap-3">
                <button id="modal-cancel" class="px-4 py-2 text-slate-400 hover:text-white text-xs font-bold uppercase transition-colors">Cancelar</button>
                <button id="modal-confirm" class="px-4 py-2 bg-red-500/20 text-red-500 border border-red-500/50 hover:bg-red-500/40 rounded-lg text-xs font-bold uppercase transition-colors">Eliminar</button>
            </div>
        </div>
    </div>
    
    <!-- Initial Score Calculator Modal -->
    <div id="calc-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-center p-4">
        <div class="bg-v-surface border border-v-border p-6 rounded-xl max-w-sm w-full shadow-2xl scale-95 opacity-0 transition-all duration-300" id="calc-modal-content">
            <h3 class="text-v-radiant font-bold text-lg mb-2 uppercase tracking-wider text-center">Promedio Inicial</h3>
            <p class="text-slate-400 text-[10px] mb-6 text-center uppercase">Ingresa 3 puntuaciones para calcular el promedio</p>
            
            <div class="flex justify-between gap-4 mb-8">
                <input type="number" id="calc-v1" min="0" onwheel="event.preventDefault()" onkeydown="if(event.key==='-')event.preventDefault()" placeholder="0" class="w-20 h-20 bg-black/40 border border-v-border rounded-xl text-center text-xl text-white outline-none focus:border-v-radiant transition-colors">
                <input type="number" id="calc-v2" min="0" onwheel="event.preventDefault()" onkeydown="if(event.key==='-')event.preventDefault()" placeholder="0" class="w-20 h-20 bg-black/40 border border-v-border rounded-xl text-center text-xl text-white outline-none focus:border-v-radiant transition-colors">
                <input type="number" id="calc-v3" min="0" onwheel="event.preventDefault()" onkeydown="if(event.key==='-')event.preventDefault()" placeholder="0" class="w-20 h-20 bg-black/40 border border-v-border rounded-xl text-center text-xl text-white outline-none focus:border-v-radiant transition-colors">
            </div>

            <div class="bg-v-radiant/10 border border-v-radiant/20 p-4 rounded-lg mb-8 text-center">
                <div class="text-slate-400 text-[10px] uppercase mb-1">Promedio Resultante</div>
                <div class="text-2xl font-bold text-v-radiant" id="calc-result">0.0</div>
            </div>

            <div class="flex justify-end gap-3">
                <button id="calc-cancel" class="px-4 py-2 text-slate-400 hover:text-white text-xs font-bold uppercase transition-colors">Cancelar</button>
                <button id="calc-apply" class="px-6 py-2 bg-v-radiant/20 text-v-radiant border border-v-radiant/50 hover:bg-v-radiant/40 rounded-lg text-xs font-bold uppercase transition-colors">Aplicar</button>
            </div>
        </div>
    </div>


    <!-- Goal Percentage Modal -->
    <div id="goal-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-center p-4">
        <div class="bg-v-surface border border-v-border p-6 rounded-xl max-w-sm w-full shadow-2xl scale-95 opacity-0 transition-all duration-300" id="goal-modal-content">
            <h3 class="text-v-radiant font-bold text-lg mb-2 uppercase tracking-wider text-center">Configurar Objetivo</h3>
            <p class="text-slate-400 text-[10px] mb-6 text-center uppercase">Establece el incremento porcentual para tu meta</p>
            
            <div class="bg-black/40 border border-v-border rounded-xl p-8 mb-8 text-center">
                <div class="flex items-center justify-center gap-2">
                    <input type="number" id="goal-input" min="0" onwheel="event.preventDefault()" onkeydown="if(event.key==='-')event.preventDefault()" step="0.1" placeholder="1.0" class="w-24 bg-transparent text-center text-4xl text-white font-bold outline-none">
                    <span class="text-4xl text-v-radiant font-bold">%</span>
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button id="goal-cancel" class="px-4 py-2 text-slate-400 hover:text-white text-xs font-bold uppercase transition-colors">Cancelar</button>
                <button id="goal-apply" class="px-6 py-2 bg-v-radiant/20 text-v-radiant border border-v-radiant/50 hover:bg-v-radiant/40 rounded-lg text-xs font-bold uppercase transition-colors">Aplicar</button>
            </div>
        </div>
    </div>

    <script>
        const months = ["ene.", "feb.", "mar.", "abr.", "may.", "jun.", "jul.", "ago.", "sept.", "oct.", "nov.", "dic."];
        let currentDate = new Date();
        let ranksCollapsed = false;

        let tasks = [];
        const taskColors = ["v-radiant", "v-elysian", "v-aurora", "v-angelic", "v-energy"];

        // Setup Tauri API call
        const invoke = window.__TAURI__ ? window.__TAURI__.core.invoke : async () => "[]";

        async function loadData() {
            try {
                const json = await invoke('load_routine');
                let parsed = JSON.parse(json);
                if (Array.isArray(parsed)) {
                    tasks = parsed;
                }
            } catch (e) {
                console.error("Error loading data:", e);
            }
            render();
        }

        async function saveData() {
            try {
                await invoke('save_routine', { data: JSON.stringify(tasks) });
            } catch (e) {
                console.error("Error saving data:", e);
            }
        }

        function addTask() {
            const color = taskColors[tasks.length % taskColors.length];
            tasks.push({
                id: Date.now().toString(),
                name: "NUEVA TAREA",
                color: color,
                initial: 0,
                target: 1.0, // Default 1%
                days: {},
                stats: {} // For the 1% columns
            });
            saveData();
            render();
        }

        function updateTaskName(index, name) {
            tasks[index].name = name;
            saveData();
        }

        function updateTaskInit(index, val) {
            tasks[index].initial = parseFloat(val) || 0;
            saveData();
            render(); // Re-render to update the goal calculation
        }

        function updateDay(taskIndex, dayIndex, val) {
            if (!tasks[taskIndex].days) tasks[taskIndex].days = {};
            tasks[taskIndex].days[dayIndex] = val;
            saveData();
        }

        function updateStat(taskIndex, statIndex, val) {
            if (!tasks[taskIndex].stats) tasks[taskIndex].stats = {};
            tasks[taskIndex].stats[statIndex] = val;
            saveData();
        }

        function deleteTask(index) {
            showConfirmModal('¿Estás seguro de que deseas eliminar esta tarea?', () => {
                tasks.splice(index, 1);
                saveData();
                render();
            });
        }

        function showConfirmModal(message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const messageEl = document.getElementById('modal-message');
            const confirmBtn = document.getElementById('modal-confirm');
            const cancelBtn = document.getElementById('modal-cancel');
            const content = document.getElementById('modal-content');

            messageEl.innerText = message;
            
            // Show
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-95', 'opacity-0');

            const close = () => {
                content.classList.add('scale-95', 'opacity-0');
                modal.classList.add('opacity-0', 'pointer-events-none');
            };

            confirmBtn.onclick = () => {
                onConfirm();
                close();
            };

            cancelBtn.onclick = close;
            modal.onclick = (e) => { if (e.target === modal) close(); };
        }

        function openCalcModal(taskIndex) {
            const modal = document.getElementById('calc-modal');
            const content = document.getElementById('calc-modal-content');
            const inputs = ['calc-v1', 'calc-v2', 'calc-v3'].map(id => document.getElementById(id));
            const resultEl = document.getElementById('calc-result');
            const applyBtn = document.getElementById('calc-apply');
            const cancelBtn = document.getElementById('calc-cancel');

            inputs.forEach(input => {
                input.value = '';
                input.oninput = () => {
                    const vals = inputs.map(i => parseFloat(i.value) || 0).filter(v => v > 0);
                    const avg = vals.length > 0 ? (vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
                    resultEl.innerText = avg.toFixed(1);
                };
            });
            resultEl.innerText = '0.0';

            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-95', 'opacity-0');

            const close = () => {
                content.classList.add('scale-95', 'opacity-0');
                modal.classList.add('opacity-0', 'pointer-events-none');
            };

            applyBtn.onclick = () => {
                const finalAvg = parseFloat(resultEl.innerText);
                updateTaskInit(taskIndex, finalAvg);
                close();
            };

            cancelBtn.onclick = close;
            modal.onclick = (e) => { if (e.target === modal) close(); };
        }

        function openGoalModal(taskIndex) {
            const modal = document.getElementById('goal-modal');
            const content = document.getElementById('goal-modal-content');
            const input = document.getElementById('goal-input');
            const applyBtn = document.getElementById('goal-apply');
            const cancelBtn = document.getElementById('goal-cancel');

            input.value = tasks[taskIndex].target || 1.0;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-95', 'opacity-0');

            const close = () => {
                content.classList.add('scale-95', 'opacity-0');
                modal.classList.add('opacity-0', 'pointer-events-none');
            };

            applyBtn.onclick = () => {
                let val = parseFloat(input.value);
                if (isNaN(val)) val = 1.0;
                if (val < 0) val = 0;
                if (val > 100) val = 100;
                
                tasks[taskIndex].target = val;
                saveData();
                render();
                close();
            };

            cancelBtn.onclick = close;
            modal.onclick = (e) => { if (e.target === modal) close(); };
        }

        function getBlockSizes(days) {
            if (days === 28) return [4, 4, 4, 4, 4, 4, 4];
            if (days === 29) return [4, 4, 4, 4, 4, 4, 5];
            if (days === 30) return [4, 4, 4, 4, 4, 5, 5];
            if (days === 31) return [4, 4, 4, 4, 5, 5, 5];
            return [4]; // fallback
        }

        function validatePercent(el) {
            let text = el.innerText.replace('%', '').trim();
            let val = parseFloat(text);
            if (isNaN(val)) val = 0;
            if (val < 0) val = 0;
            if (val > 100) val = 100;
            el.innerText = (val % 1 === 0 ? val : val.toFixed(1)) + '%';
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            render();
        }

        function toggleRanks() {
            ranksCollapsed = !ranksCollapsed;
            render(); // Re-render to apply classes
        }

        // Custom Resize Logic
        let isResizing = false;
        let resizeType = '';
        let startX, startWidth;

        function startResize(e, type) {
            isResizing = true;
            resizeType = type;
            startX = e.pageX;
            startWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue(type === 'day' ? '--day-width' : '--scenario-width'));

            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', stopResize);
            document.body.classList.add('cursor-col-resize');
        }

        function handleMouseMove(e) {
            if (!isResizing) return;
            const delta = e.pageX - startX;
            const newWidth = Math.max(10, startWidth + delta);
            document.documentElement.style.setProperty(resizeType === 'day' ? '--day-width' : '--scenario-width', `${newWidth}px`);
        }

        function stopResize() {
            isResizing = false;
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', stopResize);
            document.body.classList.remove('cursor-col-resize');
        }

        function render() {
            const headerRow = document.getElementById('header-row-1');
            const tbody = document.getElementById('tasks-body');
            const monthDisplay = document.getElementById('month-display');

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            monthDisplay.innerText = `${months[month]} ${year}`;

            while (headerRow.children.length > 1) headerRow.removeChild(headerRow.lastChild);

            const blockSizes = getBlockSizes(daysInMonth);
            let headerHtml = '';
            let currentDay = 1;
            blockSizes.forEach((size, index) => {
                for (let i = 0; i < size; i++) {
                    headerHtml += `<th class="cell w-day bg-v-surface/95 backdrop-blur-md text-[8px] text-slate-400 uppercase">
                        DAY<br>${currentDay++}
                        <div class="resize-handle" onmousedown="startResize(event, 'day')"></div>
                    </th>`;
                }
                if (index < blockSizes.length - 1) {
                    headerHtml += `<th class="cell w-stat !bg-v-aurora/20 border-v-border cursor-pointer hover:bg-v-aurora/40 overflow-hidden ${ranksCollapsed ? 'collapsed' : ''}" onclick="if(event.target === this) toggleRanks()">
                        <div contenteditable="true" onblur="validatePercent(this)" oninput="if(parseFloat(this.innerText) > 100) { this.innerText = '100'; window.getSelection().selectAllChildren(this); window.getSelection().collapseToEnd(); }" onkeydown="if(this.innerText.length >= 5 && event.key.length === 1) event.preventDefault()" onkeypress="return (event.charCode >= 48 && event.charCode <= 57) || event.charCode === 46" class="outline-none whitespace-nowrap">1%</div>
                    </th>`;
                }
            });
            headerRow.insertAdjacentHTML('beforeend', headerHtml);

            let bodyHtml = '';
            tasks.forEach((task, taskIndex) => {
                const targetPercent = task.target !== undefined ? task.target : 1.0;
                const goalValue = (task.initial * (1 + targetPercent / 100)).toFixed(1);
                bodyHtml += `<tr class="hover:bg-white/5 transition-colors group">
                    <td class="cell w-scenario group-hover:bg-slate-800 transition-colors">
                        <div class="flex items-center gap-2">
                            <button onclick="deleteTask(${taskIndex})" class="text-red-500 opacity-30 hover:opacity-100 transition-all p-1">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                            <div class="flex flex-col gap-1 overflow-hidden flex-1">
                                <div contenteditable="true" onblur="updateTaskName(${taskIndex}, this.innerText)" class="outline-none focus:text-v-radiant transition-colors truncate">${task.name}</div>
                                <div class="flex gap-3 text-[9px] font-normal text-slate-500 uppercase tracking-tighter">
                                    <span class="bg-black/30 px-1 rounded-sm cursor-pointer hover:bg-black/50 transition-colors" onclick="openCalcModal(${taskIndex})">
                                        Init: <span class="text-slate-300 outline-none">${task.initial}</span>
                                    </span>
                                    <span class="bg-black/30 px-1 rounded-sm cursor-pointer hover:bg-black/50 transition-colors" onclick="openGoalModal(${taskIndex})">
                                        Goal: <span class="text-v-radiant">${goalValue} (${targetPercent}%)</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </td>`;

                let dayIndex = 1;
                blockSizes.forEach((size, blockIndex) => {
                    for (let i = 0; i < size; i++) {
                        const currentValStr = (task.days && task.days[dayIndex]) !== undefined ? task.days[dayIndex] : '';
                        const currentVal = parseFloat(currentValStr);
                        let cellClass = "";
                        
                        if (!isNaN(currentVal) && currentValStr !== '') {
                            if (currentVal >= parseFloat(goalValue)) {
                                cellClass = "bg-emerald-500/20 text-emerald-400";
                            } else {
                                cellClass = "bg-v-aurora/20 text-v-aurora";
                            }
                        }

                        bodyHtml += `<td class="cell w-day !p-0 overflow-hidden ${cellClass}">
                            <div class="flex items-center justify-center h-full px-2">
                                <div contenteditable="true" onblur="updateDay(${taskIndex}, ${dayIndex}, this.innerText); render()" onkeypress="return (event.charCode >= 48 && event.charCode <= 57)" class="outline-none w-full text-center whitespace-nowrap overflow-hidden">${currentValStr}</div>
                            </div>
                        </td>`;
                        dayIndex++;
                    }
                    if (blockIndex < blockSizes.length - 1) {
                        const currentStat = (task.stats && task.stats[blockIndex]) !== undefined ? task.stats[blockIndex] : '1%';
                        bodyHtml += `<td class="cell w-stat !bg-${task.color}/20 !text-${task.color} overflow-hidden ${ranksCollapsed ? 'collapsed' : ''}">
                            <div contenteditable="true" onblur="validatePercent(this); updateStat(${taskIndex}, ${blockIndex}, this.innerText)" oninput="if(parseFloat(this.innerText) > 100) { this.innerText = '100'; window.getSelection().selectAllChildren(this); window.getSelection().collapseToEnd(); }" onkeydown="if(this.innerText.length >= 5 && event.key.length === 1) event.preventDefault()" onkeypress="return (event.charCode >= 48 && event.charCode <= 57) || event.charCode === 46" class="outline-none w-full text-center text-[10px] font-bold whitespace-nowrap">${currentStat}</div>
                        </td>`;
                    }
                });
                bodyHtml += `</tr>`;
            });
            tbody.innerHTML = bodyHtml;
            lucide.createIcons();
        }

        // Start the app
        loadData();
    </script>
</body>

</html>
